{% extends "store/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="auth-wrapper">

<div class="container">

<div class="auth-card mx-auto">

<div class="text-center mb-4">

<h2 class="fw-bold">

Welcome Back

</h2>

<p class="text-muted">

Login to your account

</p>

</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter username"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<div class="d-grid">

<button
class="btn btn-dark btn-lg">

Login

</button>

</div>

<div class="text-center mt-4">

<p>

Don't have an account?

<a href="{% url 'register' %}"
class="fw-semibold">

Create Account

</a>

</p>

</div>

</form>

</div>

</div>

</section>

{% endblock %}
