{% extends "base.html" %}
{% block title %}Theme — {{ site_settings.store_name }}{% endblock %}
{% block content %}
<section class="section account-layout settings-subpage">
  {% include "accounts/_account_nav.html" %}
  <div class="account-content">
    <a class="settings-back" href="{% url 'accounts:settings' %}" aria-label="Back to Settings">‹ <span>Settings</span></a>
    <div class="account-page-header"><span class="eyebrow">APPEARANCE</span><h1>Theme</h1></div>
    <div class="settings-choice-list">
      <form method="post" class="settings-choice {% if request.user.theme_preference == 'dark' %}is-selected{% endif %}">{% csrf_token %}<input type="hidden" name="theme" value="dark"><button type="submit"><span><strong>Dark</strong><small>Premium dark appearance</small></span><span class="settings-check">{% if request.user.theme_preference == 'dark' %}✓{% endif %}</span></button></form>
      <form method="post" class="settings-choice {% if request.user.theme_preference == 'light' %}is-selected{% endif %}">{% csrf_token %}<input type="hidden" name="theme" value="light"><button type="submit"><span><strong>Light</strong><small>Bright ivory appearance</small></span><span class="settings-check">{% if request.user.theme_preference == 'light' %}✓{% endif %}</span></button></form>
      <form method="post" class="settings-choice {% if request.user.theme_preference == 'system' %}is-selected{% endif %}">{% csrf_token %}<input type="hidden" name="theme" value="system"><button type="submit"><span><strong>System</strong><small>Follow your device preference</small></span><span class="settings-check">{% if request.user.theme_preference == 'system' %}✓{% endif %}</span></button></form>
    </div>
  </div>
</section>
{% endblock %}
