{% extends "dg_admin/base.html" %}
{% block admin_content %}
<h1>Customers</h1>
<form method="get" style="margin-bottom:14px;"><input type="text" name="q" value="{{ q }}" placeholder="Search customers" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);"></form>
<div class="admin-table-wrap">
<table class="admin-table">
  <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th></th></tr>
  {% for c in page_obj %}
  <tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.phone }}</td><td>{{ c.created_date|date:"d M Y" }}</td>
    <td><a href="{% url 'dg_admin:customer_detail' c.id %}" class="btn btn-sm btn-outline">View</a></td></tr>
  {% empty %}<tr><td colspan="5" class="muted">No customers yet.</td></tr>{% endfor %}
</table>
</div>
{% endblock %}
