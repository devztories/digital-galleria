{% extends "base.html" %}
{% block content %}
<section class="section">
  <h1>Categories</h1>
  <div class="product-grid">
    {% for category in categories %}
    <a class="card" href="{% url 'categories:detail' category.slug %}" style="overflow:hidden;text-align:center;">
      {% if category.image %}<img src="{{ category.image.url }}" style="height:140px;width:100%;object-fit:cover;">{% endif %}
      <div style="padding:12px;font-weight:600;">{{ category.name }}</div>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
