{% load static %}
<header class="site-header" data-search-endpoint="{% url 'products:search_suggestions' %}">
  <div class="header-inner container">
    <a href="{% url 'home' %}" class="brand-mark" aria-label="{{ site_settings.store_name|default:'Digital Galleria' }} home">
      {% if site_settings.logo %}<img class="brand-logo" src="{{ site_settings.logo.url }}" alt="{{ site_settings.store_name|default:'Digital Galleria' }}">{% endif %}<span class="brand-name">{{ site_settings.store_name|default:"Digital Galleria" }}</span>
      <span class="brand-rule" aria-hidden="true"></span>
    </a>

    <nav class="nav-links" aria-label="Primary navigation">
      <a href="{% url 'products:list' %}">Shop</a>
      <a href="{% url 'categories:list' %}">Categories</a>
      <a href="{% url 'products:list' %}?featured=1">Featured</a>
    </nav>

    <div class="header-search" id="header-search">
      <form class="search-form" action="{% url 'products:list' %}" method="get" role="search">
        <button class="search-trigger" type="button" aria-label="Open search" aria-expanded="false" data-search-trigger>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.8"></circle><path d="m16.2 16.2 4.2 4.2"></path></svg>
        </button>
        <div class="search-field-wrap">
          <input class="search-input js-search-input" type="search" name="q" placeholder="Search products" autocomplete="off" aria-label="Search products">
          <button type="button" class="search-close" data-search-close aria-label="Close search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
        <div class="search-suggestions" role="listbox" aria-label="Search suggestions"></div>
      </form>
    </div>

    <div class="header-actions">
      <a href="{% if request.user.is_authenticated %}{% url 'accounts:hub' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="icon-btn settings-icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path><path d="M19 13.2a7.5 7.5 0 0 0 0-2.4l1.5-1.1-1.7-2.9-1.8.8a7.5 7.5 0 0 0-2.1-1.2L14.7 4h-3.4l-.3 2.4a7.5 7.5 0 0 0-2.1 1.2l-1.8-.8-1.7 2.9 1.5 1.1a7.5 7.5 0 0 0 0 2.4l-1.5 1.1 1.7 2.9 1.8-.8a7.5 7.5 0 0 0 2.1 1.2l.3 2.4h3.4l.3-2.4a7.5 7.5 0 0 0 2.1-1.2l1.8.8 1.7-2.9-1.5-1.1Z"></path></svg></a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" class="icon-btn" title="Account" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"></path></svg>
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="icon-btn" title="Login" aria-label="Login">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"></path></svg>
        </a>
      {% endif %}
      <a href="{% url 'cart:cart' %}" class="icon-btn cart-icon" title="Cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.4 10.2a2 2 0 0 0 2 1.8h7.8a2 2 0 0 0 1.9-1.4L21 9H7"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        {% if cart_count %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}
      </a>
      <button class="icon-btn mobile-search-trigger" type="button" data-search-trigger aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.8"></circle><path d="m16.2 16.2 4.2 4.2"></path></svg>
      </button>
    </div>
  </div>
</header>
