{% load static %}
<button class="hopy-launcher hopy-robot" id="hopy-launcher" style="right:20px; bottom:20px;" aria-label="Open Digital Galleria Assistant">
  <svg class="hopy-robot-svg" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
    <ellipse class="hopy-robot-shadow" cx="32" cy="58" rx="15" ry="2.4"></ellipse>
    <path class="hopy-robot-antenna" d="M32 8 L32 15" stroke-width="2.6" stroke-linecap="round"></path>
    <circle class="hopy-robot-antenna-tip" cx="32" cy="6.5" r="3.4"></circle>
    <g class="hopy-robot-head-group">
      <ellipse class="hopy-robot-ear" cx="12" cy="34" rx="3.6" ry="5.2"></ellipse>
      <ellipse class="hopy-robot-ear" cx="52" cy="34" rx="3.6" ry="5.2"></ellipse>
      <rect class="hopy-robot-head" x="12" y="14" width="40" height="36" rx="18"></rect>
      <ellipse class="hopy-robot-cheek" cx="22" cy="36" rx="4.2" ry="2.6"></ellipse>
      <ellipse class="hopy-robot-cheek" cx="42" cy="36" rx="4.2" ry="2.6"></ellipse>
      <g class="hopy-robot-eyes">
        <circle class="hopy-robot-eye" cx="25.5" cy="29" r="3.4"></circle>
        <circle class="hopy-robot-eye-shine" cx="24.3" cy="27.6" r="1.1"></circle>
        <circle class="hopy-robot-eye" cx="38.5" cy="29" r="3.4"></circle>
        <circle class="hopy-robot-eye-shine" cx="37.3" cy="27.6" r="1.1"></circle>
      </g>
      <path class="hopy-robot-smile" d="M25 37c2.6 3.2 11.4 3.2 14 0"></path>
    </g>
  </svg>
</button>
<div class="hopy-window" id="hopy-window" aria-label="Digital Galleria chat">
  <div class="hopy-header">
    <span>Hopy — here to help</span>
    <button class="hopy-close" type="button" aria-label="Close chat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>
  <div class="hopy-messages" aria-live="polite">
    <div class="hopy-msg bot">Hi! I'm Hopy. Ask me about any product or send an image, video or file.</div>
  </div>
  <div class="hopy-quick-actions" data-hopy-quick-actions>
    <button type="button" data-quick-query="show products">🛍 Products</button>
    <button type="button" data-quick-query="offers">🔥 Offers</button>
    <button type="button" data-quick-query="my cart">🛒 My Cart</button>
    <button type="button" data-quick-query="my orders">📦 My Orders</button>
    <button type="button" data-quick-query="track my order">🚚 Track Order</button>
    <button type="button" data-quick-query="my account">👤 My Account</button>
    <button type="button" data-quick-query="customize">🎨 Customize</button>
  </div>
  <form class="hopy-input-row" enctype="multipart/form-data">
    {% csrf_token %}
    <label class="hopy-attach" aria-label="Attach image, video or file" title="Attach">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.7-9.7a4.5 4.5 0 0 1 6.4 6.4L9.9 18.9a3 3 0 1 1-4.2-4.2l8.8-8.8"></path></svg>
      <input type="file" name="attachment" accept="image/*,video/*,.pdf,.txt,.doc,.docx,.zip" hidden>
    </label>
    <input type="text" name="text" placeholder="Message Digital Galleria…" autocomplete="off">
    <button type="submit" class="hopy-send" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h14M13 6l6 6-6 6"></path></svg></button>
  </form>
</div>
<script src="{% static 'js/hopy.js' %}"></script>
