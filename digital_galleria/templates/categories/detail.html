{% extends "base.html" %}
{% block content %}
<section class="section">
  <h1>{{ category.name }}</h1>
  {% if products %}
  <div class="product-grid">
    {% for product in products %}{% include "partials/product_card.html" %}{% endfor %}
  </div>
  {% else %}
  <div class="empty-state"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="m5 17 4-4 3 3 2-2 5 4"></path></svg></div><p>No products in this category yet.</p></div>
  {% endif %}
</section>
{% endblock %}
