{% extends "dg_admin/base.html" %}
{% block admin_content %}
<div class="admin-topbar"><div><span class="eyebrow">PRODUCT DELIVERY</span><h1>{{ product.name }}</h1></div></div>
<form method="post" class="card" style="padding:24px;max-width:620px">{% csrf_token %}
  <div class="form-group"><label><input type="checkbox" name="delivery_enabled" {% if product.delivery_enabled %}checked{% endif %}> Delivery enabled</label></div>
  <div class="form-group"><label><input type="checkbox" name="free_delivery" {% if product.free_delivery %}checked{% endif %}> Free delivery</label></div>
  <div class="form-group"><label>Legacy first-item charge</label><input type="number" step="0.01" min="0" name="first_item_delivery_charge" value="{{ product.first_item_delivery_charge }}"></div>
  <div class="form-group"><label>Legacy additional-item charge</label><input type="number" step="0.01" min="0" name="additional_item_delivery_charge" value="{{ product.additional_item_delivery_charge }}"></div>
  <button type="submit" class="btn">Save product delivery settings</button>
</form>
{% endblock %}
