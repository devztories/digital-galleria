{% extends "admin/base.html" %}
{% load static %}
{% block title %}Digital Galleria Control Center{% endblock %}
{% block branding %}
<div id="site-name" class="dg-brand"><a href="{% url 'admin:index' %}"><span class="dg-logo">DG</span><span><strong>Digital Galleria</strong><small>CREATOR CONTROL CENTER</small></span></a></div>
{% endblock %}
{% block extrahead %}
{{ block.super }}
<style>
:root{--dg-bg:#09070d;--dg-panel:#111019;--dg-panel2:#171521;--dg-line:rgba(255,255,255,.09);--dg-text:#f7f3ff;--dg-muted:#a8a1b6;--dg-accent:#9b6cff;--dg-accent2:#d3b8ff;--dg-green:#6ee7b7;--dg-shadow:0 24px 70px rgba(0,0,0,.35)}
html,body{background:radial-gradient(circle at 10% 0%,rgba(155,108,255,.12),transparent 32%),radial-gradient(circle at 100% 10%,rgba(211,184,255,.08),transparent 28%),var(--dg-bg)!important;color:var(--dg-text)}
body,#container,#content-main,.module,#changelist,.form-row,.aligned label,.aligned input,.aligned select,.aligned textarea{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#header{background:rgba(9,7,13,.88)!important;border-bottom:1px solid var(--dg-line);backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.2);padding:13px 24px;position:sticky;top:0;z-index:20}
#branding{float:left}.dg-brand a{display:flex;align-items:center;gap:12px;color:#fff!important;text-decoration:none}.dg-logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#c084fc);box-shadow:0 10px 30px rgba(124,58,237,.35);font-weight:900;letter-spacing:-.05em}.dg-brand strong{display:block;font-size:15px;letter-spacing:.02em}.dg-brand small{display:block;color:#9d96aa;font-size:9px;letter-spacing:.18em;margin-top:2px}
#user-tools{padding-top:10px;color:#c9c2d2}#user-tools a{color:#e6dcff!important;border-bottom:0!important}
#content{padding:30px 28px 60px;max-width:1600px;margin:auto}#content h1{font-weight:800;letter-spacing:-.03em;color:#fff}.breadcrumbs{background:rgba(17,16,25,.8)!important;border:1px solid var(--dg-line);border-radius:14px;margin:18px 28px 0;padding:12px 16px!important;color:#aaa2b8!important}.breadcrumbs a{color:#cbb7ff!important}
.module,.inline-group,#changelist-filter,.submit-row,.object-tools a,.paginator,.results,.calendarbox,.clockbox{background:var(--dg-panel)!important;border:1px solid var(--dg-line)!important;border-radius:18px!important;box-shadow:var(--dg-shadow);overflow:hidden}.module h2,.module caption,.inline-group h2{background:linear-gradient(135deg,rgba(155,108,255,.18),rgba(255,255,255,.02))!important;color:#fff!important;border-bottom:1px solid var(--dg-line)!important}.module table{border-color:var(--dg-line)!important}.module td,.module th{border-color:var(--dg-line)!important;color:#ded8e7}.module th{background:rgba(255,255,255,.025)!important}.module tr:hover td{background:rgba(155,108,255,.06)!important}
input,select,textarea,.vTextField,.vURLField,.vIntegerField{background:#0b0a10!important;color:#f5f1fa!important;border:1px solid #302a3d!important;border-radius:11px!important;padding:10px 12px!important}.selector select{background:#0b0a10!important}.selector-available h2,.selector-chosen h2{background:#17131f!important}.help,.helptext{color:#938b9f!important}.errornote,.errors{border-radius:12px!important}.messagelist li{border-radius:12px!important}
.button,.submit-row input,.object-tools a,.addlink,.deletelink{border-radius:11px!important;border:1px solid rgba(255,255,255,.1)!important;padding:9px 14px!important;font-weight:750!important}.button.default,.submit-row input.default,.object-tools .addlink{background:linear-gradient(135deg,#7c3aed,#a855f7)!important;color:#fff!important}.button:hover,.object-tools a:hover{transform:translateY(-1px);filter:brightness(1.08)}
#nav-sidebar{background:rgba(13,11,18,.96)!important;border-right:1px solid var(--dg-line)}#nav-sidebar .module{box-shadow:none;border:0!important;background:transparent!important}#nav-sidebar th{color:#91889e!important}#nav-sidebar a{color:#c9c2d2!important}#nav-sidebar a:hover{background:rgba(155,108,255,.1)!important;color:#fff!important}.toggle-nav-sidebar{background:#17131f!important;border:1px solid var(--dg-line)!important}
.dashboard-card{background:linear-gradient(145deg,#14121d,#0e0d13);border:1px solid var(--dg-line);border-radius:20px;padding:20px;box-shadow:var(--dg-shadow)}
@media(max-width:800px){#header{padding:12px 15px}#content{padding:22px 14px 50px}.breadcrumbs{margin-left:14px;margin-right:14px}.dg-brand small{display:none}}
</style>
{% endblock %}
