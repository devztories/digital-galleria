{% extends "base.html" %}
{% block title %}Account — {{ site_settings.store_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="account-page-header">
    <span class="eyebrow">ACCOUNT</span>
    <h1>Account</h1>
  </div>
  <div class="settings-choice-list">
    <a class="settings-choice-link settings-choice" href="{% url 'accounts:profile' %}">
      <span><strong>Profile</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
    <a class="settings-choice-link settings-choice" href="{% url 'accounts:my_orders' %}">
      <span><strong>My Orders</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
    <a class="settings-choice-link settings-choice" href="{% url 'accounts:addresses' %}">
      <span><strong>Addresses</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
    <a class="settings-choice-link settings-choice" href="{% url 'accounts:settings' %}">
      <span><strong>Settings</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
    <a class="settings-choice-link settings-choice" href="{% url 'accounts:change_password' %}">
      <span><strong>Change Password</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
    <a class="settings-choice-link settings-choice settings-hub-logout" href="{% url 'accounts:logout' %}">
      <span><strong>Logout</strong></span><span class="settings-check" aria-hidden="true">›</span>
    </a>
  </div>
</section>
{% endblock %}
