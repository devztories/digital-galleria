{% extends "base.html" %}
{% block title %}Settings — {{ site_settings.brand_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:600px;">
    <h1 style="font-size:1.7rem; margin-bottom:26px;">Settings</h1>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <a href="{% url 'accounts:profile' %}" class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>Profile</span><span class="muted">→</span></a>
      <a href="{% url 'accounts:my_orders' %}" class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>Orders</span><span class="muted">→</span></a>
      <a href="{% url 'accounts:theme' %}" class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>Theme ({{ request.user.get_theme_display }})</span><span class="muted">→</span></a>
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>Gender</span><span class="muted">{{ request.user.get_gender_display|default:"Not set" }}</span></div>
      <form method="post" action="{% url 'accounts:logout' %}" class="card" style="display:flex; justify-content:space-between; align-items:center;">
        {% csrf_token %}
        <span>Logout</span>
        <button type="submit" style="background:none;border:none;color:#f87171;font-weight:600;">Logout</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
