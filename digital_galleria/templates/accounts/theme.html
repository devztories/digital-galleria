{% extends "base.html" %}
{% block title %}Theme — {{ site_settings.brand_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:420px;">
    <h1 style="font-size:1.6rem; margin-bottom:6px;">Theme</h1>
    <p class="muted" style="margin-bottom:22px;">Changing your theme never changes your saved gender.</p>
    <form method="post" class="form-card">
      {% csrf_token %}
      <div class="gender-choice">
        <div class="gender-option">
          <input type="radio" name="theme" value="dark" id="theme_dark" {% if request.user.theme == 'dark' %}checked{% endif %}>
          <label for="theme_dark">🌙 Dark</label>
        </div>
        <div class="gender-option">
          <input type="radio" name="theme" value="light" id="theme_light" {% if request.user.theme == 'light' %}checked{% endif %}>
          <label for="theme_light">☀ Light</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save Theme</button>
    </form>
  </div>
</section>
{% endblock %}
