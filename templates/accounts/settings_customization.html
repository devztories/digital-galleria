{% extends "base.html" %}
{% block back_home %}true{% endblock %}
{% block title %}Customization — {{ site_settings.store_name }}{% endblock %}
{% block content %}
<section class="section account-solo settings-subpage">
  
  <div class="account-content">
    <a class="settings-back" href="{% url 'accounts:settings' %}" aria-label="Back to Settings">‹ <span>Settings</span></a>
    <div class="account-page-header"><span class="eyebrow">PERSONALIZE</span><h1>Customization</h1></div>
    <div class="settings-choice-list">
      <a class="settings-choice settings-choice-link" href="{% url 'home' %}"><span><strong>Direct Customization</strong><small>Choose a customizable product and upload your references</small></span><span aria-hidden="true">›</span></a>
    </div>
  </div>
</section>
{% endblock %}
