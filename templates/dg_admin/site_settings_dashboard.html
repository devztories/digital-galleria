{% extends "dg_admin/base.html" %}
{% block admin_content %}
<div class="admin-topbar"><div><h1>Site Settings</h1><p class="muted">Pick an area below. Each one opens its own focused page.</p></div></div>
<div class="settings-hub-grid">
  {% for card in cards %}
  <a class="settings-hub-card" href="{{ card.url }}">
    <span><strong>{{ card.title }}</strong><small>{{ card.desc }}</small></span>
    <span aria-hidden="true">›</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
