<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Payment Submitted | Digital Galleria
    </title>

</head>

<body style="
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    padding: 60px 20px;
">

    <div style="
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
    ">

        <h1>
            Payment Submitted
        </h1>

        <p>
            Your payment details for
            <strong>Order #{{ order.id }}</strong>
            have been submitted.
        </p>

        <h2>
            ₹{{ order.total_amount }}
        </h2>

        <p>
            Transaction / UTR ID:
            <strong>
                {{ payment.upi_transaction_id }}
            </strong>
        </p>

        <p>
            Status:
            <strong>
                {{ payment.status }}
            </strong>
        </p>

        <p>
            Your payment is awaiting verification.
        </p>

        <a href="/"
           style="
               display: inline-block;
               margin-top: 20px;
               padding: 14px 25px;
               background: #111;
               color: white;
               text-decoration: none;
               border-radius: 6px;
           ">

            Back to Digital Galleria

        </a>

    </div>

</body>

</html>
